[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-tax"
version = "0.1.1"
description = "Measure the token tax of Agent2Agent (A2A) endpoints. Dumb math, honest numbers, zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ZidoCode" }]
keywords = ["agents", "audit", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
a2a-tax = "a2a_tax:main"

[tool.setuptools]
py-modules = ["a2a_tax"]
